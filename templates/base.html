<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    {% block social_meta %}
      <meta property="og:site_name" content="{{ config.title }}">
      <meta property="og:type" content="website">
      <meta property="og:title" content="{{ config.title }}">
      <meta property="og:description" content="{{ config.description }}">
      <meta name="twitter:card" content="summary">
    {% endblock social_meta %}
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    {% block head_extra %}{% endblock head_extra %}
    <script src="/session-status.js" defer></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="site-title" href="/">{{ config.title }}</a>
      </header>

      <main>
        {% block content %}{% endblock content %}
      </main>

      <footer class="site-footer">
        <a href="https://github.com/Falafel-Open-Games/xadrez.live" rel="noopener noreferrer">GitHub</a>
        <a href="/privacidade/">Privacidade</a>
      </footer>
    </div>
    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"bdf8c4d7c2fc407498bf95ab2ccba728"}'></script>
    <!-- End Cloudflare Web Analytics -->
    <!-- GoatCounter Analytics -->
    <script data-goatcounter="https://fcz.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
    <!-- End GoatCounter Analytics -->
  </body>
</html>
