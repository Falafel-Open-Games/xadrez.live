name: Update external streams

on:
  push:
    branches:
      - main
    paths:
      - "scripts/update_external_streams.py"
      - "data/external_stream_sources.toml"
      - "tests/test_update_external_streams.py"
      - ".github/workflows/external-streams.yml"
  schedule:
    - cron: "10 11 * * *"
    - cron: "55 17 * * *"
    - cron: "00 18 * * *"
    - cron: "05 18 * * *"
    - cron: "15 18 * * *"
    - cron: "25 18 * * *"
    - cron: "35 18 * * *"
    - cron: "45 18 * * *"
    - cron: "05 19 * * *"
    - cron: "35 19 * * *"
    - cron: "05 20 * * *"
    - cron: "35 20 * * *"
    - cron: "10 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: external-streams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: v0.23.3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o zola.tar.gz
          tar -xzf zola.tar.gz
          sudo mv zola /usr/local/bin/zola
          zola --version

      - name: Snapshot current stream data
        run: cp data/external_streams.toml /tmp/external_streams.before.toml

      - name: Update external stream data
        run: python3 scripts/update_external_streams.py

      - name: Build site
        run: zola build

      - name: Commit updated stream data
        run: |
          grep -v '^updated_at = ' /tmp/external_streams.before.toml > /tmp/external_streams.before.normalized.toml
          grep -v '^updated_at = ' data/external_streams.toml > /tmp/external_streams.after.normalized.toml

          if cmp -s /tmp/external_streams.before.normalized.toml /tmp/external_streams.after.normalized.toml; then
            echo "No meaningful external stream changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external_streams.toml
          git commit -m "Update external stream feed"
          git push
