name: Deploy Zola site to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "scripts/update_external_streams.py"
      - "data/external_stream_sources.toml"
      - ".github/workflows/external-streams.yml"
  workflow_run:
    workflows:
      - Update external streams
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: v0.23.3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o zola.tar.gz
          tar -xzf zola.tar.gz
          sudo mv zola /usr/local/bin/zola
          zola --version

      - name: Update supporters data
        run: python3 scripts/update_supporters.py

      - name: Update site stats
        run: python3 scripts/update_site_stats.py

      - name: Update Lichess rating history
        run: python3 scripts/update_lichess_rating_history.py

      - name: Export cached PGNs
        run: python3 scripts/export_session_pgns.py

      - name: Build site
        run: zola build

      - name: Update sitemap lastmod
        run: python3 scripts/update_sitemap_lastmod.py

      - name: Generate search index
        run: npx -y pagefind@1.5.2

      - name: Copy custom domain
        run: cp CNAME public/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Submit all URLs to IndexNow
        run: python3 scripts/submit_indexnow.py --all-pages
