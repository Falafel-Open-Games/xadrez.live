name: Update YouTube chat acknowledgements

on:
  push:
    branches:
      - main
    paths:
      - "scripts/update_youtube_chat_acks.py"
      - ".github/workflows/youtube-chat-acks.yml"
  schedule:
    - cron: "30 15 * * *"
    - cron: "30 18 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-chat-acks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: v0.22.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o zola.tar.gz
          tar -xzf zola.tar.gz
          sudo mv zola /usr/local/bin/zola
          zola --version

      - name: Update YouTube chat acknowledgements
        run: python3 scripts/update_youtube_chat_acks.py --latest 5

      - name: Update supporters data
        run: python3 scripts/update_supporters.py

      - name: Build site
        run: zola build

      - name: Commit updated acknowledgements
        run: |
          if git diff --quiet -- content/fcz data/supporters.toml; then
            echo "No YouTube chat acknowledgement or supporter changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/fcz data/supporters.toml
          git commit -m "Update YouTube chat acknowledgements"
          git push
